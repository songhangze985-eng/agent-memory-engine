name: eval-weekly-release

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      split:
        description: "Dataset split (dev for tuning, test or full for release)"
        required: false
        default: "dev"
      llm_model:
        description: "Optional live OpenAI-compatible reader model (e.g., openai/gpt-oss-20b or gemini-3-pro)"
        required: false
        default: ""
      extractor_model:
        description: "Optional separate fact extractor model (explicitly recorded in provenance)"
        required: false
        default: ""
      judge_model:
        description: "Optional live Hindsight-aligned LLM judge model (e.g., gpt-4o-mini)"
        required: false
        default: ""

jobs:
  weekly-release-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tier 3 — Protocol Verification & Full Test Suite
        run: |
          python3 -m pytest -q
          python3 -m eval.gates.run_gates
          python3 -m eval.ambient_perf_bench --facts 2000 --queries 400 --out /tmp/c3_release.json --md-out /tmp/c3_release.md
          python3 -m eval.coding.run_coding_eval --out /tmp/step_c_release.json --md-out /tmp/step_c_release.md
          python3 -m eval.hybrid.realmem_eval --out /tmp/step_d_release.json --md-out /tmp/step_d_release.md
      - name: Tier 3 — Frozen-Protocol Multi-Seed QA Eval (when cached datasets are mounted)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
          JUDGE_BASE_URL: ${{ secrets.JUDGE_BASE_URL }}
        run: |
          if [ -f eval/longmemeval/.cache/longmemeval_s_cleaned.json ] && [ -f eval/locomo/.cache/locomo10.json ]; then
            EXTRA_ARGS=""
            if [ -n "${{ inputs.llm_model }}" ]; then EXTRA_ARGS="$EXTRA_ARGS --llm-model ${{ inputs.llm_model }}"; fi
            if [ -n "${{ inputs.extractor_model }}" ]; then EXTRA_ARGS="$EXTRA_ARGS --extractor-model ${{ inputs.extractor_model }}"; fi
            if [ -n "${{ inputs.judge_model }}" ]; then EXTRA_ARGS="$EXTRA_ARGS --judge-model ${{ inputs.judge_model }}"; fi
            python3 -m eval.qa.run_qa \
              --protocol eval/protocol.yaml \
              --engines full_context turn_rrf unified \
              --benchmarks longmemeval locomo \
              --split "${{ inputs.split || 'dev' }}" \
              --seeds 42 137 2026 \
              $EXTRA_ARGS \
              --out /tmp/release_qa_report.json \
              --md-out /tmp/release_qa_report.md
          else
            echo "Cached LongMemEval/LoCoMo datasets not present in runner; skipping full QA arm."
          fi
      - name: Upload Release Evaluation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-eval-reports
          path: /tmp/*release*
