name: ci

on:
  push:
    branches: [main, "cursor/**", "refactor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python3 -m pytest -q
      - name: Deterministic pass/fail regression gates
        run: python3 -m eval.gates.run_gates --skip-long-horizon
      - name: Small mock eval smoke
        run: python3 -m eval.run_eval --scale small --mode mock --out /tmp/small_eval.json
