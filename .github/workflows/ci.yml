name: ci-pr-fast-gate

on:
  push:
    branches: [main, "cursor/**", "refactor/**", "feat/**"]
  pull_request:

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tier 1 — Unit, Dual-Profile Contract, C1/C2/C3, Host & Hybrid Tests
        run: python3 -m pytest -q
      - name: Tier 1 — Deterministic Pass/Fail Regression Gates (exact, version, chrono, stress)
        run: python3 -m eval.gates.run_gates --skip-long-horizon
      - name: Tier 1 — Step C Coding Reuse & Staleness Gate (G2)
        run: python3 -m eval.coding.run_coding_eval --out /tmp/coding_gate.json --md-out /tmp/coding_gate.md
      - name: Tier 1 — Step D Mixed-Profile & Scope-Chain Gate
        run: python3 -m eval.hybrid.realmem_eval --out /tmp/hybrid_gate.json --md-out /tmp/hybrid_gate.md
      - name: Tier 1 — Small Mock Eval Smoke
        run: python3 -m eval.run_eval --scale small --mode mock --out /tmp/small_eval.json
