[project]
name = "memengine"
version = "0.1.0"
description = "认知记忆引擎：规则路由、渐近原点毒圈、平行 Z 轴坍缩与 3D 笔记本。"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
memengine = "memengine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
postgres = ["psycopg[binary,pool]>=3.2"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
all = ["psycopg[binary,pool]>=3.2", "fastapi>=0.115", "uvicorn>=0.30"]
neural = ["sentence-transformers>=3.0.0"]
onnx = ["fastembed>=0.4.0", "onnxruntime>=1.18.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memengine*"]

[tool.setuptools.data-files]
"share/memengine/prompts" = ["prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
