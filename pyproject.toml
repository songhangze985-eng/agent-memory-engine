[project]
name = "agentmem-core"
version = "0.3.0"
description = "统一单核双时态 Agent 记忆引擎（UnifiedMemoryEngine）：L0 冷存 + FTS5、统一双时态事实账本、派生 VFS/画像视图、槽位更新、实体图覆盖打包与反思做梦。"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
agentmem-core = "agentmem_core.cli:main"
agentmem = "agentmem_core.cli:main"
memengine = "agentmem_core.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
lance = ["lancedb>=0.20", "pyarrow>=17.0"]
postgres = ["psycopg[binary,pool]>=3.2"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
all = ["psycopg[binary,pool]>=3.2", "fastapi>=0.115", "uvicorn>=0.30", "lancedb>=0.20", "pyarrow>=17.0"]
neural = ["sentence-transformers>=3.0.0"]
onnx = ["fastembed>=0.4.0", "onnxruntime>=1.18.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentmem_core*", "memengine*"]

[tool.setuptools.data-files]
"share/agentmem_core/prompts" = ["prompts/*.txt"]
"share/agentmem_core/profiles" = ["profiles/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
