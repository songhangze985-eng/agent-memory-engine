protocol_version: "1.0.0"
description: Frozen apples-to-apples evaluation protocol for agentmem-core (G1 & G5 compliance).

backbones:
  open_20b:
    reader_model: "openai/gpt-oss-20b"
    extractor_model: "openai/gpt-oss-20b"
    notes: "20B-class open-source backbone aligned with Hindsight open-source reference line."
  frontier:
    reader_model: "gemini-3-pro"
    extractor_model: "gemini-2.5-flash"
    notes: "Frontier backbone aligned with Hindsight Gemini-3 Pro reference line; smaller extractor explicitly disclosed."
  offline_ci:
    reader_model: "MockLLMClient/DeterministicReader"
    extractor_model: "DeterministicRuleExtractor"
    notes: "Zero-API offline CI track for deterministic regression & attribution; never compared against live LLM leaderboards."

judge:
  live_model: "gpt-4o-mini"
  offline_model: "deterministic-v1"
  prompt_version: "hindsight-aligned-v1"
  seeds:
    - 42
    - 137
    - 2026

retrieval:
  embedder: "HashedTfidfEmbedder"
  neural_embedder: "BAAI/bge-small-en-v1.5"
  reranker: "CalibratedLocalReranker"
  top_k: 10
  token_budget: 2048
  full_context_max_tokens: 128000
  rrf_k: 60

arms:
  - full_context
  - turn_rrf
  - unified

splits:
  dev_ratio: 0.25
  tuning_split: "dev"
  final_report_split: "test"
  rule: "All parameter/prompt tuning MUST run strictly on dev split; final report runs once on held-out test/full split."

datasets:
  longmemeval_s:
    path: "eval/longmemeval/.cache/longmemeval_s_cleaned.json"
    sha256: "d6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442"
  locomo10:
    path: "eval/locomo/.cache/locomo10.json"
    sha256: "79fa87e90f04081343b8c8debecb80a9a6842b76a7aa537dc9fdf651ea698ff4"
  membench:
    path: "eval/membench/.cache/MemData"
    sha256: "10737d41e6db88a2bc5179dab9598d0cb21abbdffa23376d6336c3e862dc877c"

reference_lines:
  hindsight_open_20b:
    source: "Hindsight official benchmark runner (20B open-source backbone)"
    longmemeval_s_qa: 0.836
    locomo_qa: 0.832
  hindsight_gemini_3_pro:
    source: "Hindsight Gemini-3 Pro benchmark report (different protocol from open_20b)"
    longmemeval_s_qa: 0.914
  hindsight_preprint_locomo:
    source: "Hindsight arXiv preprint highest reported LoCoMo setting (different protocol from open_20b)"
    locomo_qa: 0.8961
